// Stutter reproduction, variant E: control, engine defaults (from `help` on this client, 2026-10-28) for every cvar
// variant A sets, with fps_max and engine_no_focus_sleep held equal to A.
rate 80000
cl_cmdrate 30
cl_updaterate 20
cl_interp_ratio 2
cl_interp 0.1
cl_smooth 1
cl_smoothtime 0.1
cl_localnetworkbackdoor 1
cl_pred_optimize 2
net_chokeloop 0
net_compresspackets 1
net_compresspackets_minsize 1024
net_splitpacket_maxrate 80000
net_maxcleartime 4.0
net_maxfragments 1260
net_maxroutable 1260
net_maxpacketdrop 5000
net_queued_packet_thread 1
net_splitrate 1
lzma_persistent_buffer 0
host_thread_mode 0
host_limitlocal 0
mat_queue_mode -1
fps_max 400
engine_no_focus_sleep 0
