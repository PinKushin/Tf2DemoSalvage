// Stutter reproduction (Tf2DemoSalvage docs/measurements/2026-10-28-stutter-reproduction.md), variant A:
// the Discord user's network lines, copied from their autoexec, plus three of their non-network lines
// (host_thread_mode 1, lzma_persistent_buffer 1, mat_queue_mode -1) and the session's fps_max/engine_no_focus_sleep pins.
rate 131072
cl_cmdrate 66
cl_updaterate 66
cl_interp_ratio 2
cl_interp 0
cl_smooth 1
cl_smoothtime .05
cl_localnetworkbackdoor 0
cl_pred_optimize 1
net_chokeloop 1
net_compresspackets 1
net_compresspackets_minsize 200
net_splitpacket_maxrate 131072
net_maxcleartime 0
net_maxfragments 1200
net_maxroutable 1200
net_maxpacketdrop 0
net_queued_packet_thread 1
net_splitrate 2
lzma_persistent_buffer 1
host_thread_mode 1
host_limitlocal 1
mat_queue_mode -1
fps_max 400
engine_no_focus_sleep 0
