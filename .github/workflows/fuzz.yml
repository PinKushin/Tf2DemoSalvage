# Coverage-guided fuzzing (SharpFuzz + libFuzzer).
#
# Nightly and deliberately short for the two primitive targets. docs/FUZZING.md measured
# bitreader and varint saturating after roughly 15,000 executions - `ft:` stops moving and the
# remaining ~790,000 executions find nothing. A long run against either would burn hours to
# learn nothing, so those two stay a regression guard rather than a search.
#
# container and snappy landed 2026-08-11 and are the targets that comment used to say "when they
# land, raise the budget" about. They earned it immediately: the first deterministic run (see
# ContainerFuzzPropertyTests) found a Snappy declared-length overflow and a dem_stop tick
# truncation, both reachable from a crafted demo. Real bugs on the first pass means there is
# more still findable, so they get their own longer per-target time via the matrix below rather
# than sharing the 120s default.
#
# No Git LFS here on purpose: fuzzing builds Core and the harness and never reads the demo
# corpus, so this workflow spends none of the account's 1 GiB/month LFS bandwidth.
name: Fuzz

on:
  schedule:
    # 05:00 UTC daily, before the mutation run so the two never contend for a runner.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds per target'
        type: string
        default: '120'

# Release assets live under Contents, so publishing the shared corpus needs write here. Kept at the
# workflow level with nothing else raised: this workflow pushes no code and opens no pull request.
permissions:
  contents: write

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One job per target so the dashboard names which decoder failed, and so one crashing
      # target does not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - target: bitreader
            seconds: '120'
          - target: varint
            seconds: '120'
          # Longer: these two are where the corpus test already found real bugs on its first
          # run, and both have a length read from the data itself driving further reads or an
          # allocation - the shape that rewards more search time, unlike the two primitives
          # above which merely stay inside a fixed contract.
          - target: container
            seconds: '600'
          - target: snappy
            seconds: '600'
    env:
      MAX_TOTAL_TIME: ${{ inputs.seconds || matrix.seconds }}

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache libfuzzer-dotnet
        id: libfuzzer-cache
        uses: actions/cache@v6
        with:
          path: ~/libfuzzer-dotnet
          key: libfuzzer-dotnet-${{ runner.os }}-v1

      - name: Build libfuzzer-dotnet
        if: steps.libfuzzer-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          git clone --depth 1 https://github.com/Metalnem/libfuzzer-dotnet.git /tmp/libfuzzer-dotnet
          clang -fsanitize=fuzzer /tmp/libfuzzer-dotnet/libfuzzer-dotnet.cc -o ~/libfuzzer-dotnet

      - name: Publish the harness
        run: dotnet publish tests/Tf2DemoSalvage.Fuzz -c Release -o publish

      - name: Seed the container target
        # Without a seed the corpus starts empty, and the container target's input has an
        # 8-byte magic and a 1072-byte fixed header before anything varies - mutation from
        # nothing never crosses that reliably. Not a demo from the corpus: lfs is disabled
        # above and this workflow never reads tools/corpus/demos. TF2FUZZ_SEED_PATH makes the
        # harness generate its own valid demo from DemoWriter instead.
        #
        # **This step MUST run before instrumentation, and it used to run after.** SharpFuzz
        # rewrites Core.dll to record coverage into a shared memory region that libFuzzer creates;
        # run that instrumented assembly under a plain `dotnet` with no fuzzer around it and the
        # writes land nowhere valid:
        #
        #   Fatal error. System.AccessViolationException: Attempted to read or write protected
        #   memory. ... Process completed with exit code 134
        #
        # The seed generator is an ordinary program run, not a fuzz iteration, so it needs the
        # harness and not the instrumentation. Moving it above the instrument step is the whole fix.
        #
        # **It failed this way every night from at least 2026-08-13 to 2026-08-16 and read as a
        # finding.** A fuzz workflow going red is what a crash looks like, so a crash in the SEED
        # step wears the same clothes as the thing the workflow exists to detect - and the container
        # target, the one with the most surface, was not fuzzed at all for those four days.
        if: matrix.target == 'container'
        run: |
          mkdir -p corpus-container
          TF2FUZZ_SEED_PATH=corpus-container/seed dotnet publish/Tf2DemoSalvage.Fuzz.dll

      - name: Instrument the code under test
        run: |
          dotnet tool install --global SharpFuzz.CommandLine
          before=$(stat -c%s publish/Tf2DemoSalvage.Core.dll)
          # Instrument Core, not the harness. Re-run after every publish; publishing silently
          # un-instruments (docs/FUZZING.md).
          sharpfuzz publish/Tf2DemoSalvage.Core.dll
          after=$(stat -c%s publish/Tf2DemoSalvage.Core.dll)
          echo "Core.dll $before -> $after bytes"
          # The only proof instrumentation actually happened. Without it the fuzzer runs happily
          # and explores nothing, which looks identical to a clean run.
          test "$after" -gt "$before"

      - name: Restore fuzz corpus
        uses: actions/cache/restore@v6
        with:
          path: corpus-${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fold in the shared corpus
        # The box is ARM64 and this runner is x64. Without pooling, an input discovered on one is
        # never executed on the other, so a fault that only manifests on one architecture is
        # unreachable from the machine that found the input triggering it. More budget does not
        # substitute: it explores more of the same architecture.
        #
        # An Actions cache cannot be read from outside a runner, which is why the shared store is a
        # release asset. Reading needs no credential because the repo is public.
        #
        # Never fatal. The cache above and the seed below still make the run useful.
        run: |
          mkdir -p corpus-${{ matrix.target }}
          url="https://github.com/${{ github.repository }}/releases/download/fuzz-corpus/corpus-${{ matrix.target }}.tar.zst"
          if curl -fsSL -o /tmp/shared.tar.zst "$url"; then
            mkdir -p /tmp/shared
            if tar -C /tmp/shared -xf /tmp/shared.tar.zst 2>/dev/null; then
              before=$(ls corpus-${{ matrix.target }} | wc -l)
              # -n: never overwrite an input this runner's cache already holds.
              cp -n /tmp/shared/* corpus-${{ matrix.target }}/ 2>/dev/null || true
              echo "merged $before -> $(ls corpus-${{ matrix.target }} | wc -l) inputs"
            else
              echo "::warning::the shared corpus asset did not unpack; using the cache only"
            fi
          else
            echo "nothing published yet, or the fetch failed; using the cache only"
          fi

      - name: Fuzz
        env:
          TF2FUZZ_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p corpus-${{ matrix.target }} artifacts-${{ matrix.target }}
          before=$(ls corpus-${{ matrix.target }} | wc -l)

          ~/libfuzzer-dotnet \
            --target_path=$(which dotnet) \
            --target_arg=$PWD/publish/Tf2DemoSalvage.Fuzz.dll \
            corpus-${{ matrix.target }} \
            -max_total_time=$MAX_TOTAL_TIME \
            -print_final_stats=1 \
            -artifact_prefix=artifacts-${{ matrix.target }}/

          after=$(ls corpus-${{ matrix.target }} | wc -l)
          echo "corpus entries: $before -> $after"

      - name: Save fuzz corpus
        # The fuzzer's memory. An input that took an hour to discover is worth keeping, and a
        # corpus that never grows across runs is the tell that instrumentation broke.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: corpus-${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Minimise and publish the shared corpus
        # `success()` is the gate and it is load-bearing: a run that found a crash must not
        # overwrite the shared corpus. Minimising keeps only coverage-increasing inputs, and a
        # crashing input is never in the corpus anyway, so publishing after a finding would be
        # tidying up around the evidence.
        #
        # Each matrix job publishes its OWN target's asset, so the four parallel jobs never write
        # the same name. A single shared asset would be a last-writer-wins race that silently
        # discarded three targets' findings every night.
        if: success()
        run: |
          mkdir -p corpus-min
          ~/libfuzzer-dotnet \
            --target_path=$(which dotnet) \
            --target_arg=$PWD/publish/Tf2DemoSalvage.Fuzz.dll \
            -merge=1 corpus-min corpus-${{ matrix.target }} > merge.log 2>&1 || true

          # A failed merge leaves an empty directory. Publishing that would delete the shared
          # corpus for every machine, so the unminimised one is kept instead.
          if [ "$(ls corpus-min | wc -l)" -gt 0 ]; then
            echo "minimised $(ls corpus-${{ matrix.target }} | wc -l) -> $(ls corpus-min | wc -l)"
            rm -rf corpus-${{ matrix.target }} && mv corpus-min corpus-${{ matrix.target }}
          else
            echo "::warning::merge produced nothing; publishing the unminimised corpus"
          fi

          tar -C corpus-${{ matrix.target }} -cf - . \
            | zstd -19 -T0 -q -o corpus-${{ matrix.target }}.tar.zst -f

          # The release is a prerelease created once by hand; `gh release upload --clobber`
          # replaces the asset, which the raw API refuses to do.
          gh release upload fuzz-corpus corpus-${{ matrix.target }}.tar.zst --clobber \
            || echo "::warning::publish failed; the cache above still holds this run's corpus"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: artifacts-${{ matrix.target }}/
          if-no-files-found: ignore
