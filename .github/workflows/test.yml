# The test suite. Nothing ran `dotnet test` on push or pull request before this workflow; the
# repository had only Fuzz and Mutation, both nightly, so a broken commit reached main and was
# found by whichever nightly job happened to run next.
#
# Split into two jobs because the suite is not uniform in what it needs:
#
#   unit   - Core and Cli. Pure managed, no demos, no native libraries. Runs on Linux, starts
#            immediately, and is the gate that catches most breakage.
#   corpus - Corpus and Audio. Needs the Git LFS demo blobs AND celt.dll/speex.dll, so it runs
#            on Windows, where tools/native-audio/build.ps1 works as written against the MSVC
#            toolset the runner image already carries. Porting that build to Linux is possible
#            but is a separate piece of work, and doing it badly would mean testing a codec
#            built with different flags from the one a developer runs locally - which for CELT
#            is exactly the class of mistake RISKS B33 was (ENABLE_POSTFILTER).
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run for the same ref. Not politeness: the corpus job pulls Git LFS
  # blobs, and the free tier is 1 GiB of bandwidth a month, so a superseded run that keeps going
  # spends budget on a commit nobody is waiting for.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (Core, Cli)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # No demo blobs are read by either project here, so this job costs no LFS bandwidth.
          lfs: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Never --no-build: a compile error must fail the run rather than leaving the previous
      # binary in place to be tested. `dotnet test` builds by default, so this is simply the
      # flag being absent, but it is absent deliberately.
      - name: Core
        run: >
          dotnet test tests/Tf2DemoSalvage.Core.Tests -c Release
          --logger 'trx;LogFileName=core.trx'
          --collect:"XPlat Code Coverage" --results-directory coverage/core

      - name: Cli
        run: >
          dotnet test tests/Tf2DemoSalvage.Cli.Tests -c Release
          --logger 'trx;LogFileName=cli.trx'
          --collect:"XPlat Code Coverage" --results-directory coverage/cli

      # **Content was not run by CI at all until 2026-08-22** — 612 tests covering every BSP, VTF,
      # MDL, VMT and VPK reader, gated only by the local build/gate.sh. That is the largest suite
      # after Core and it reads the most hostile input of any of them.
      #
      # It belongs in this job rather than the Windows one: the project is plain net10.0, it needs
      # no Git LFS blobs (only ToolMaterialFlagsProbe touches the corpus, and that is [Explicit]),
      # and the tests that want an installed game already skip through
      # GameAssetIntegrationTests.GameFolder. So it costs no LFS bandwidth and no Windows minutes.
      - name: Content
        run: >
          dotnet test tests/Tf2DemoSalvage.Content.Tests -c Release
          --logger 'trx;LogFileName=content.trx'
          --collect:"XPlat Code Coverage" --results-directory coverage/content

      - name: Check the counts
        # "Passed!" is not the result, the count is. A crashed test host prints a pass line with
        # a truncated total, and a --filter matching nothing exits 0 with no summary at all.
        # Floors rather than exact equality: an exact number turns every added test into a red
        # build, while a floor still catches the two failures that actually hide - a host that
        # died partway and a run that executed nothing. Raise these when tests are added.
        #
        # **A floor far below the real count catches neither.** These sat at 744 and 34 while the
        # suites held 1034 and 352, and on 2026-08-17 a solution-wide run reported 50 of Viewer's
        # 350 tests as a pass (B104) — which 34 would have accepted. A floor is only a guard while
        # it is close to the number it guards.
        # **Measured on run 32553435747, not inferred.** These were set by arithmetic first —
        # an older run's numbers plus the tests added since — and the arithmetic rested on a
        # premise that turned out to be false: that CI totals sit below local ones because some
        # cases enumerate from files a runner lacks.
        #
        # They do not. CI reported 1491 / 74 / 612, which is exactly what build/gate.sh reports
        # locally. The older run's lower figures were simply an older commit. A .trx total counts
        # SKIPPED tests, so a case that cannot run on a runner still appears — Content executed 366
        # of 612 here against 587 locally, and the total is identical either way.
        #
        # Exact rather than slack, per docs/memory/a-floor-must-track-the-number-it-guards.md:
        # adding tests keeps passing, removing them fails until the number is lowered on purpose.
        run: |
          ./build/assert-test-count.sh '**/core.trx' 1497 Core
          ./build/assert-test-count.sh '**/cli.trx' 74 Cli
          ./build/assert-test-count.sh '**/content.trx' 613 Content

      # **Coverage, gated PER ASSEMBLY rather than per report.** A Cobertura file's root line-rate
      # averages every assembly the run loaded, including ones the suite never touches — measured
      # 2026-08-22, Cli.Tests reports 37% at the file level and 99% for the Cli assembly itself,
      # because its report also carries Core at 56%. Gating the file total would have produced a
      # floor that can never fail. build/assert-coverage.sh reads the package element.
      #
      # **Floors are set from CI's numbers, which are NOT the local ones — unlike the test counts.**
      # A .trx total counts skipped tests, so a count is the same in both places; coverage is what
      # actually EXECUTED, so it moves with the environment. Measured on run 32553892662:
      #
      #   assembly   local            CI            why they differ
      #   Core       96.0 / 89.5      95.3 / 89.0   almost none
      #   Cli        99.6 / 97.0      81.1 / 86.9   this job runs lfs:false, so the CLI tests take
      #                                             their no-demo paths — they pass, and cover less
      #   Content    86.5 / 73.3      (see below)   366 of 612 execute without an installed game
      #
      # So the Cli floor is 78/83 rather than the 95/92 a local measurement suggests. **Raising it
      # to match local would mean fetching the LFS blobs into this job**, which costs bandwidth
      # against a 1 GiB monthly budget to gate a number, and is not worth it.
      #
      # Content's floor is provisional: its number has never printed, because the first version of
      # this step stopped at Cli's failure. Tightened once a run reports it.
      #
      # Deliberately a "don't regress off a cliff" line rather than a target. The owner's framing
      # (D50) is that implementations are being taken fast, so this must not become a tax on
      # writing code — it exists to catch a whole area losing its tests, not to chase a number.
      # **All three report before any of them fails, and that is a fix rather than a nicety.** The
      # first version ran them as three statements under `set -e`, so Cli failing meant Content's
      # number was never printed — one run told me about one assembly. A gate that stops at the
      # first problem makes every diagnosis serial.
      - name: Check the coverage
        run: |
          failed=0
          ./build/assert-coverage.sh \
            "$(find coverage/core -name coverage.cobertura.xml | head -1)" \
            Tf2DemoSalvage.Core 90 85 || failed=1
          ./build/assert-coverage.sh \
            "$(find coverage/cli -name coverage.cobertura.xml | head -1)" \
            tf2demosalvage 78 83 || failed=1
          ./build/assert-coverage.sh \
            "$(find coverage/content -name coverage.cobertura.xml | head -1)" \
            Tf2DemoSalvage.Content 55 45 || failed=1
          exit $failed

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-trx
          path: |
            **/*.trx
            coverage/**/coverage.cobertura.xml

  corpus:
    name: Corpus + Audio (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Deliberately NOT lfs: true. Checking out with LFS enabled fetches the blobs on every
          # run and bills every one of them. The cache step below fetches them once per change
          # to the corpus instead, and the pointer files checked out here are what keys it.
          lfs: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache the demo blobs
        id: lfs-cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          # Keyed on the pointer files themselves. An LFS pointer's content IS the object's oid,
          # so this key changes exactly when the corpus changes and never otherwise - which is
          # the property that keeps the monthly LFS bandwidth flat as commits accumulate.
          key: lfs-${{ hashFiles('tools/corpus/demos/*.dem') }}

      - name: Fetch the demo blobs
        run: git lfs pull

      - name: Check the corpus actually materialised
        shell: pwsh
        # The failure this prevents is silent and total. Corpus.Files() skips anything under
        # SmallestPlausibleDemo (4096 bytes) so an unfetched LFS pointer is not mistaken for a
        # demo - which means a failed `git lfs pull` produces an EMPTY corpus, and a corpus test
        # that iterates `foreach (path in Corpus.Files())` then passes having asserted nothing.
        # Every one of them. Green, fast, and measuring nothing at all.
        run: |
          $demos = Get-ChildItem tools/corpus/demos -Filter *.dem |
                   Where-Object { $_.Length -ge 4096 }
          Write-Host "$($demos.Count) demos, $([math]::Round(($demos | Measure-Object Length -Sum).Sum / 1MB)) MB"
          if ($demos.Count -lt 10) {
              throw "Expected at least 10 fetched demos, found $($demos.Count) - git lfs pull did not deliver the corpus."
          }

      - name: Cache the native codecs
        id: native-cache
        uses: actions/cache@v6
        with:
          path: |
            tools/native-audio/celt.dll
            tools/native-audio/speex.dll
          # The build script pins both upstream versions and the compile flags, so its own
          # content is the whole input to the build.
          key: native-audio-${{ runner.os }}-${{ hashFiles('tools/native-audio/build.ps1') }}

      - name: Build celt.dll and speex.dll
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/native-audio/build.ps1

      - name: Check the codecs are present
        shell: pwsh
        # CeltVoiceDecoder and SpeexVoiceDecoder throw pointing at build.ps1 when the library is
        # missing, so absence would surface as a test failure rather than a skip. Checking here
        # anyway makes the cause obvious instead of arriving as sixty identical decoder errors.
        run: |
          foreach ($lib in 'celt.dll', 'speex.dll') {
              $path = "tools/native-audio/$lib"
              if (-not (Test-Path $path)) { throw "$lib was neither cached nor built." }
              Write-Host "$lib $((Get-Item $path).Length) bytes"
          }

      - name: Viewer shell
        # Windows-only because WinForms is. These construct the form without showing it, so they
        # need no display and no graphics adapter - the device is only created once the viewport
        # panel gets a window handle.
        run: dotnet test tests/Tf2DemoSalvage.Viewer3D.Tests -c Release --logger 'trx;LogFileName=viewer.trx'

      - name: Audio
        run: dotnet test tests/Tf2DemoSalvage.Audio.Tests -c Release --logger 'trx;LogFileName=audio.trx'

      - name: Corpus
        run: dotnet test tests/Tf2DemoSalvage.Corpus.Tests -c Release --logger 'trx;LogFileName=corpus.trx'

      - name: Viewer UI
        # A hosted Windows runner DOES have a desktop - it is just small, so the window geometry
        # is pinned here to what CI actually provides. Both size and position: with only a size
        # the window sits at (0,0), where screen and window-relative coordinates coincide and any
        # confusion between them is invisible.
        #
        # No machine-wide lock here, unlike a developer machine: the runner is a fresh VM with
        # nothing else driving its desktop.
        env:
          TF2VIEW_WINDOW_SIZE: 754x512
          TF2VIEW_WINDOW_POS: 85,78
        run: dotnet test tests/Tf2DemoSalvage.Viewer3D.UiTests -c Release --logger 'trx;LogFileName=viewer-ui.trx'

      - name: Check the counts
        shell: bash
        # The corpus floor is the load-bearing one, and it is deliberately NOT the number a full
        # local run produces. Several corpus tests are per-demo, so the count tracks how many demos
        # were found: 95 in CI against the committed corpus, ~130 locally where tools/corpus/local
        # is also picked up. The CI number is the floor precisely because a drop below it means
        # demos went missing — the failure that would otherwise be invisible, since a corpus test
        # over zero demos passes.
        #
        # **That reasoning was written down correctly and then the LOCAL number was used.** The
        # floor sat at 130 against a CI count of 95, so it could only ever fail — and it never ran,
        # because the UI step above it failed first and stopped the job. Two faults, each hiding the
        # other, for at least five consecutive pushes. Fixed 2026-08-22 and measured on run
        # 32553435747: audio 28, viewer 570, viewer-ui 12, corpus 95.
        #
        # Exact rather than slack, per docs/memory/a-floor-must-track-the-number-it-guards.md. The
        # old values had 200 tests of slack on Viewer and 12 on Audio, which is not a guard.
        run: |
          ./build/assert-test-count.sh '**/audio.trx' 28 Audio
          ./build/assert-test-count.sh '**/viewer.trx' 570 Viewer
          ./build/assert-test-count.sh '**/viewer-ui.trx' 12 ViewerUi
          ./build/assert-test-count.sh '**/corpus.trx' 96 Corpus

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: corpus-trx
          path: '**/*.trx'
