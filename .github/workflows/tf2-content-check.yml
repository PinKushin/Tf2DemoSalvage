# TEMPORARY (D212): counts the tests that skip or degrade on a hosted runner with the TF2
# dedicated server's content. Deleted once the number is recorded.
name: TF2 content check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    # measured healthy: ~30 min (estimate, temporary workflow)
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: [Presentation, Rendering, Content, Audio]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: ./.github/actions/tf2-server
      - name: Test
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          dotnet test "tests/Tf2DemoSalvage.$PROJECT.Tests" --logger "trx;LogFileName=r.trx" --results-directory out || true
          grep -o '<Counters [^>]*>' out/r.trx
          echo "not executed / skipped outcomes:"
          grep -o 'outcome="NotExecuted"' out/r.trx | wc -l
