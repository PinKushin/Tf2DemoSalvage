# Mutation testing (Stryker.NET), across all three test projects.
#
# Two schedules in one workflow, because the projects differ in cost by two orders of magnitude
# after the split in DECISIONS.md D25:
#
#   Core.Tests    558 synthetic tests, no corpus   ~4 min    daily
#   Cli.Tests      51 tests, needs one demo        ~1 min    daily
#   Corpus.Tests   63 tests, walks 305 MB          hours     weekly
#
# Those are the owner's machine. Elsewhere is slower and the gap is large: the same Core project
# measured 33m05s on the Oracle mutation box (3 OCPU ARM64) — roughly 8x, not the 3x a hosted
# runner usually costs. Do not size a timeout from the 4-minute figure. (The box is gone, D212;
# the measurement is kept as history. The other test projects run in the `projects` job below.)
#
# An earlier box run of the same project reported 11m16s and a 37.74% score, and it was neither:
# it printed "All mutants have been tested" having accounted for 1215 of 1954 mutants. A
# truncated Stryker run still prints a full report with a plausible percentage, so compare the
# mutant total against a known-good run before believing either number.
#
# The corpus job is gated on the weekly cron so the daily run stays under ten minutes. A manual
# dispatch runs everything.
name: Mutation

on:
  schedule:
    # Daily: the two fast projects.
    - cron: '0 6 * * *'
    # Sunday: everything, including the slow corpus project.
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      since:
        description: 'Only mutate code changed since main (much faster)'
        type: boolean
        default: false
      project:
        description: 'Run only this test project (e.g. Tf2DemoSalvage.Scene.Tests); empty = the scheduled set'
        type: string
        default: ''
      mutate:
        description: 'Stryker --mutate pattern for the project run (e.g. **/EntityModels.cs); empty = whole project'
        type: string
        default: ''

permissions:
  contents: read

env:
  WEEKLY_CRON: '0 7 * * 0'

jobs:
  core:
    name: Core (synthetic)
    if: inputs.project == ''
    runs-on: ubuntu-latest
    # 33m05s measured on the Oracle box; this runner's speed relative to that is not yet known,
    # so the ceiling is set well clear of it rather than tuned. A job killed at the timeout uploads
    # nothing and the `if-no-files-found: error` below then reports a second, misleading failure.
    timeout-minutes: 90
    steps:
      # No Git LFS here at all. After the D25 split this project is entirely synthetic - it does
      # not read a single demo - so it costs none of the account's 1 GiB/month LFS bandwidth and
      # needs no cache.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - run: dotnet tool restore

      - name: Stryker (Core)
        working-directory: tests/Tf2DemoSalvage.Core.Tests
        run: dotnet stryker ${{ inputs.since && '--since:main' || '' }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-report-core
          path: tests/Tf2DemoSalvage.Core.Tests/StrykerOutput/*/reports/
          if-no-files-found: error

  viewer:
    name: Viewer3D (Windows only)
    # **The one job that cannot go anywhere else, and the reason is the target framework.**
    # Tf2DemoSalvage.Viewer3D is net10.0-windows with UseWindowsForms, so it needs the Windows
    # Desktop targeting pack and runtime — which exist only on Windows. Measured on mutation-box
    # 2026-08-19: aarch64 Linux, `~/.dotnet/packs` has no WindowsDesktop entry and
    # `~/.dotnet/shared` holds only Microsoft.NETCore.App and Microsoft.AspNetCore.App. That is
    # not a provisioning gap to close; Windows Desktop is Windows-only.
    #
    # Running it on the owner's machine instead is worse than it looks: a local Stryker run
    # rebuilds mutated copies continuously and holds obj/, so it takes the machine-wide exclusive
    # lock and blocks every other agent's UI suite for the duration. A hosted runner costs nobody
    # anything — this repository is public, so standard GitHub-hosted minutes are free and
    # unmetered.
    #
    # The self-hosted concern recorded in the global standards does not apply here. That rule is
    # about stranger-authored workflow code reaching the Oracle boxes through a `pull_request`
    # trigger; a GitHub-hosted runner is ephemeral and isolated, and this workflow has no
    # `pull_request` trigger in any case.
    if: inputs.project == ''
    runs-on: windows-latest
    # 2731 mutants after coverage capture, measured locally 2026-08-19 before the run was stopped.
    # That is ~1.5x Core's 1879, and this runner's speed relative to the Oracle box is not known,
    # so the ceiling is set clear of the estimate rather than tuned to it. A job killed at the
    # timeout uploads nothing, and `if-no-files-found: error` then reports a second, misleading
    # failure on top of the first.
    timeout-minutes: 150
    steps:
      # No Git LFS. The viewer's tests write their own demos — a header and a dem_stop — so this
      # job reads no corpus file and costs none of the account's 1 GiB/month LFS bandwidth.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - run: dotnet tool restore

      - name: Stryker (Viewer3D)
        working-directory: tests/Tf2DemoSalvage.Viewer3D.Tests
        run: dotnet stryker ${{ inputs.since && '--since:main' || '' }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-report-viewer
          path: tests/Tf2DemoSalvage.Viewer3D.Tests/StrykerOutput/*/reports/
          if-no-files-found: error

  cli:
    name: CLI
    if: inputs.project == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Fetched explicitly below so the objects can be cached. Letting checkout pull LFS
          # would spend the account's 1 GiB/month bandwidth on every run.
          lfs: false
          fetch-depth: 0

      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch corpus
        run: |
          git lfs pull
          git lfs checkout
          # A pointer stub is ~130 bytes. If the demos did not really arrive, the tests that need
          # one degrade to no-ops rather than failing - exactly the trap in RISKS B20.
          smallest=$(find tools/corpus/demos -name '*.dem' -printf '%s\n' | sort -n | head -1)
          echo "smallest demo: $smallest bytes"
          test "$smallest" -gt 4096

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - run: dotnet tool restore

      - name: Stryker (CLI)
        working-directory: tests/Tf2DemoSalvage.Cli.Tests
        run: dotnet stryker ${{ inputs.since && '--since:main' || '' }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-report-cli
          path: tests/Tf2DemoSalvage.Cli.Tests/StrykerOutput/*/reports/
          if-no-files-found: error

  corpus:
    name: Corpus
    # Weekly only, or on demand. This is the hours-long one: its tests walk 305 MB of real demos,
    # and every mutant re-runs them.
    if: inputs.project == '' && (github.event.schedule == '0 7 * * 0' || github.event_name == 'workflow_dispatch')
    # After `cli`, so the LFS cache is already populated. Run in parallel they would both miss it
    # and pull 305 MB each.
    needs: cli
    runs-on: ubuntu-latest
    # Measured: a hosted 4-core runner is roughly 3x slower than the owner's machine on this
    # workload - the pre-split combined project took 1h29m locally and was still running at 4h36m
    # here. GitHub's hard ceiling for a job is 6 hours, so this is near the practical maximum.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: false
          fetch-depth: 0

      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch corpus
        run: |
          git lfs pull
          git lfs checkout
          smallest=$(find tools/corpus/demos -name '*.dem' -printf '%s\n' | sort -n | head -1)
          echo "smallest demo: $smallest bytes"
          test "$smallest" -gt 4096

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - run: dotnet tool restore

      - name: Stryker (Corpus)
        working-directory: tests/Tf2DemoSalvage.Corpus.Tests
        run: |
          # Scheduled runs mutate only what changed in the last week. A full run is hours and
          # the weekly cadence makes "everything, again" mostly wasted work.
          #
          # NOT `--since:main`. This workflow runs *on* main, so that would diff main against
          # itself, find nothing, mutate nothing, and report a clean run - the same silent
          # success as an upload that finds no files. The comparison point has to be a commit
          # that is actually behind HEAD, which is why checkout uses fetch-depth: 0.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            since=$(git rev-list -1 --before='7 days ago' HEAD)
            if [ -z "$since" ]; then
              echo "no commit older than 7 days; running in full"
              dotnet stryker
            else
              echo "mutating changes since $since ($(git log -1 --format=%cs "$since"))"
              dotnet stryker --since:"$since"
            fi
          else
            dotnet stryker ${{ inputs.since && '--since:main' || '' }}
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-report-corpus
          path: tests/Tf2DemoSalvage.Corpus.Tests/StrykerOutput/*/reports/
          # Not a warning. An upload that finds nothing is how a workflow keeps a green tick
          # while having stopped producing anything - see the CI annotations rule.
          if-no-files-found: error

  projects:
    name: Projects (${{ matrix.project }}, weekly)
    # The projects the Oracle mutation-box used to run (D212). Tests that read the installed game
    # (TF2_FOLDER, D184) get the TF2 dedicated server's content from the tf2-server action; what
    # that server still lacks degrades those tests - the count is recorded in D212.
    if: inputs.project == '' && (github.event.schedule == '0 7 * * 0' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # measured healthy: ~350 min is a ceiling, not a measurement (not yet run; replace from the first run)
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        project: [Scene, Presentation, Rendering, Animation, Content, Audio]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Only the projects whose tests read TF2_FOLDER (grep tests/); Scene and Animation do not.
      - if: contains(fromJSON('["Presentation","Rendering","Content","Audio"]'), matrix.project)
        uses: ./.github/actions/tf2-server

      - run: dotnet tool restore

      - name: Stryker (${{ matrix.project }})
        working-directory: tests/Tf2DemoSalvage.${{ matrix.project }}.Tests
        env:
          SINCE: ${{ inputs.since }}
        run: |
          # Scheduled runs mutate only the last week's changes. NOT `--since:main`: this runs on
          # main, so that diffs main against itself and silently mutates nothing (see the corpus job).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            since=$(git rev-list -1 --before='7 days ago' HEAD)
            if [ -z "$since" ]; then
              echo "no commit older than 7 days; running in full"
              dotnet stryker
            else
              echo "mutating changes since $since ($(git log -1 --format=%cs "$since"))"
              dotnet stryker --since:"$since"
            fi
          elif [ "$SINCE" = "true" ]; then
            dotnet stryker --since:main
          else
            dotnet stryker
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-report-${{ matrix.project }}
          path: tests/Tf2DemoSalvage.${{ matrix.project }}.Tests/StrykerOutput/*/reports/
          if-no-files-found: error

  adhoc:
    name: Ad hoc (one project)
    # Dispatch-only: `project` is set. No LFS, so a project that reads corpus demos (Cli, Corpus)
    # degrades to no-op tests here - use their own jobs for those. Viewer3D is Windows-only.
    if: inputs.project != ''
    runs-on: ${{ contains(inputs.project, 'Viewer3D') && 'windows-latest' || 'ubuntu-latest' }}
    # The ceiling is the largest project's (the viewer job above), since any project may be named.
    # measured healthy: ~1 min (Logging.Tests estimate, first run pending - not yet measured)
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # --since needs history to diff against (a shallow clone has no `main` to compare to).
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Linux projects only; Viewer3D is Windows and the action is bash/apt.
      - if: runner.os == 'Linux' && (contains(inputs.project, 'Presentation') || contains(inputs.project, 'Rendering') || contains(inputs.project, 'Content') || contains(inputs.project, 'Audio'))
        uses: ./.github/actions/tf2-server

      - run: dotnet tool restore

      - name: Stryker (one project)
        working-directory: tests/${{ inputs.project }}
        shell: bash
        # Inputs go through env, never interpolated into the script (injection).
        env:
          MUTATE: ${{ inputs.mutate }}
          SINCE: ${{ inputs.since }}
        run: |
          args=()
          [ -n "$MUTATE" ] && args+=(--mutate "$MUTATE")
          [ "$SINCE" = "true" ] && args+=(--since:origin/main)
          dotnet stryker "${args[@]}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-report-adhoc
          path: tests/${{ inputs.project }}/StrykerOutput/*/reports/
          if-no-files-found: error
