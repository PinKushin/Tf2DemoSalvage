# Mutation testing (Stryker.NET), across all three test projects.
#
# Two schedules in one workflow, because the projects differ in cost by two orders of magnitude
# after the split in DECISIONS.md D25:
#
#   Core.Tests    558 synthetic tests, no corpus   ~4 min    daily
#   Cli.Tests      51 tests, needs one demo        ~1 min    daily
#   Corpus.Tests   63 tests, walks 305 MB          hours     weekly
#
# The corpus job is gated on the weekly cron so the daily run stays under ten minutes. A manual
# dispatch runs everything.
name: Mutation

on:
  schedule:
    # Daily: the two fast projects.
    - cron: '0 6 * * *'
    # Sunday: everything, including the slow corpus project.
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      since:
        description: 'Only mutate code changed since main (much faster)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  WEEKLY_CRON: '0 7 * * 0'

jobs:
  core:
    name: Core (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No Git LFS here at all. After the D25 split this project is entirely synthetic - it does
      # not read a single demo - so it costs none of the account's 1 GiB/month LFS bandwidth and
      # needs no cache.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet tool restore

      - name: Stryker (Core)
        working-directory: tests/Tf2DemoSalvage.Core.Tests
        run: dotnet stryker ${{ inputs.since && '--since:main' || '' }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-core
          path: tests/Tf2DemoSalvage.Core.Tests/StrykerOutput/*/reports/
          if-no-files-found: error

  cli:
    name: CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetched explicitly below so the objects can be cached. Letting checkout pull LFS
          # would spend the account's 1 GiB/month bandwidth on every run.
          lfs: false
          fetch-depth: 0

      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch corpus
        run: |
          git lfs pull
          git lfs checkout
          # A pointer stub is ~130 bytes. If the demos did not really arrive, the tests that need
          # one degrade to no-ops rather than failing - exactly the trap in RISKS B20.
          smallest=$(find tools/corpus/demos -name '*.dem' -printf '%s\n' | sort -n | head -1)
          echo "smallest demo: $smallest bytes"
          test "$smallest" -gt 4096

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet tool restore

      - name: Stryker (CLI)
        working-directory: tests/Tf2DemoSalvage.Cli.Tests
        run: dotnet stryker ${{ inputs.since && '--since:main' || '' }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-cli
          path: tests/Tf2DemoSalvage.Cli.Tests/StrykerOutput/*/reports/
          if-no-files-found: error

  corpus:
    name: Corpus
    # Weekly only, or on demand. This is the hours-long one: its tests walk 305 MB of real demos,
    # and every mutant re-runs them.
    if: github.event.schedule == '0 7 * * 0' || github.event_name == 'workflow_dispatch'
    # After `cli`, so the LFS cache is already populated. Run in parallel they would both miss it
    # and pull 305 MB each.
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 0

      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch corpus
        run: |
          git lfs pull
          git lfs checkout
          smallest=$(find tools/corpus/demos -name '*.dem' -printf '%s\n' | sort -n | head -1)
          echo "smallest demo: $smallest bytes"
          test "$smallest" -gt 4096

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet tool restore

      - name: Stryker (Corpus)
        working-directory: tests/Tf2DemoSalvage.Corpus.Tests
        run: dotnet stryker ${{ inputs.since && '--since:main' || '' }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-corpus
          path: tests/Tf2DemoSalvage.Corpus.Tests/StrykerOutput/*/reports/
          # Not a warning. An upload that finds nothing is how a workflow keeps a green tick
          # while having stopped producing anything - see the CI annotations rule.
          if-no-files-found: error
