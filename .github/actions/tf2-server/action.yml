name: TF2 dedicated server content
description: >
  Downloads Valve's TF2 dedicated server (SteamCMD, anonymous, app 232250) fresh and exports
  TF2_FOLDER at its `tf` directory, so tests that read the installed game (D184) have content on a
  hosted runner (D212). Not cached: it is ~15 GB, over the 10 GB Actions cache limit, so a disk
  cleanup comes first and what the tests never open is deleted afterwards.
runs:
  using: composite
  steps:
    - name: Free disk
      shell: bash
      run: |
        df -h /
        # Preinstalled toolchains this repo never uses. NOT /usr/share/dotnet: the build needs it.
        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
        docker image prune --all --force > /dev/null || true
        df -h /

    - name: Download the server
      shell: bash
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update -q
        sudo apt-get install -y -q lib32gcc-s1
        mkdir -p ~/steamcmd
        curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C ~/steamcmd
        start=$SECONDS
        ~/steamcmd/steamcmd.sh +force_install_dir "$HOME/tf2ds" +login anonymous +app_update 232250 validate +quit
        echo "download took $((SECONDS - start)) s"

    - name: Trim and export TF2_FOLDER
      shell: bash
      run: |
        du -sh "$HOME"/tf2ds/* "$HOME"/tf2ds/tf/* 2>/dev/null | sort -h | tail -25
        # The tests resolve content under tf/ and hl2/ only (SteamInstall, D184). Everything else
        # in the install is server binaries and the steam runtime.
        find "$HOME/tf2ds" -mindepth 1 -maxdepth 1 ! -name tf ! -name hl2 -exec rm -rf {} +
        echo "TF2_FOLDER=$HOME/tf2ds/tf" >> "$GITHUB_ENV"
        du -sh "$HOME/tf2ds"
        df -h /
