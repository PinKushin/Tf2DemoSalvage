// tf2ds_era_pre2011.cfg - the one-argument `build` shared by 2007, 2008 and 2009 (see tf2ds_era_2007.cfg for why).
// Same timing as the shared ds_engineer_build; only the two build lines differ.
alias ds_engineer_build "echo tf2ds_mark engineer_build; joinclass engineer; wait 132; build 3; wait 66; +attack; wait 10; -attack; wait 330; build 0; wait 66; +attack; wait 10; -attack; wait 198; kill; wait 99; ds_medic"
