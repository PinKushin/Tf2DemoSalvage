// tf2ds_era_pre2011.cfg - the one-argument `build` shared by 2007, 2008 and 2009 (see tf2ds_era_2007.cfg for why).
// The two build lines differ from the shared ds_engineer_build, and so does the end (the wait for both buildings, below).
//
// The kill waits for BOTH buildings to FINISH. The fixed `wait 198` killed the dispenser at 44 % on 3420 and on 4231
// (measured, Probe `buildings`: health 66/150, pct 0.44): objects.txt shipped with 3258/3420/3862 gives BuildTime 10
// (sentry) and 20 (dispenser) seconds, and at the ~16 fps these clients run, 198 waits is well short of 20 s. So the
// step ends on `tf2ds_mark engineer_wait`, the session's driver reads the POV demo as it is recorded (scratchpad
// pollbuild.ps1) and sends `ds_engineer_go` once both read finished; with no driver (2007's self-driving autoexec)
// the fallback wait runs ds_engineer_cont instead. ds_engineer_go disarms the fallback, so the rest runs once.
alias ds_engineer_noop "echo tf2ds_mark engineer_fallback_disarmed"
alias ds_engineer_go "alias ds_engineer_cont ds_engineer_noop; echo tf2ds_mark engineer_go; kill; wait 99; ds_medic"
alias ds_engineer_cont "echo tf2ds_mark engineer_fallback; ds_engineer_go"
alias ds_engineer_build "echo tf2ds_mark engineer_build; joinclass scout; wait 132; joinclass engineer; wait 132; sv_cheats 1; setpos -1536 300 -340; wait 33; build 3; wait 66; +attack; wait 33; -attack; wait 330; sv_cheats 1; impulse 101; setpos -1536 -300 -340; wait 33; build 0; wait 66; +attack; wait 33; -attack; echo tf2ds_mark engineer_wait; wait 3960; ds_engineer_cont"
