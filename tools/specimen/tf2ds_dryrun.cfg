// tf2ds_dryrun.cfg - a timing run that records nothing: exec after the era file, before ds_start. Every step still runs
// and still echoes its tf2ds_mark, so con_logfile / console.log time the chain and show what the build refused.
alias ds_rec "echo tf2ds_mark dry-run-not-recording"
alias ds_rec_stop "echo tf2ds_mark dry-run-not-stopping"
