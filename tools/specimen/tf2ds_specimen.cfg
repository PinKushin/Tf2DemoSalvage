// tf2ds_specimen.cfg - records one deterministic specimen demo of the current TF2 build.
//
// Copy to <TF2>/tf/cfg/, then `map cp_badlands` and, once in, `exec tf2ds_specimen`. It records `tf2ds_specimen.dem`,
// plays every class through every weapon slot, taunts, forced conditions (TF_COND_* numbers from tf_shareddefs.h
// ETFCond) and deaths, with bots of both teams present, then stops recording and disconnects. Timing is in `wait`
// frames at fps_max 66, so it is the same every run. Used to date and test a new TF2 build
// (docs/memory/record-specimens-with-the-tf2-mcp.md).
//
// SEQUENCING: a `wait` delays only the rest of the text it appears in (CCommandBuffer::AddText, tier1/
// commandbuffer.cpp). An alias's waits do NOT delay its caller, so `a; b` with waits inside `a` runs `b` at once
// (measured: `t_in; wait; echo C` printed C before t_in's second line). So every reusable step ends by running
// `ds_k`, and its caller sets `ds_k` to what comes next. Never list two waiting aliases in a row.

sv_cheats 1
cl_disablehtmlmotd 1
fps_max 66
mp_respawnwavetime 0
mp_disable_respawn_times 1
mp_waitingforplayers_cancel 1
tf_bot_quota 0

// Reusable steps; each ends with ds_k.
alias ds_move "+forward; wait 99; -forward; +moveleft; wait 66; -moveleft; +back; wait 33; -back; +moveright; wait 66; -moveright; +jump; wait 15; -jump; wait 66; +duck; wait 66; -duck; wait 10; ds_k"
alias ds_fire "+attack; wait 99; -attack; +attack2; wait 33; -attack2; +reload; wait 66; -reload; wait 10; ds_k"
alias ds_end "taunt; wait 330; kill; wait 99; ds_k"

// Every slot fired, then ds_after_slots.
alias ds_slots "slot1; wait 40; alias ds_k ds_slots2; ds_fire"
alias ds_slots2 "slot2; wait 40; alias ds_k ds_slots3; ds_fire"
alias ds_slots3 "slot3; wait 40; alias ds_k ds_after_slots; ds_fire"

// One class: spawn, move, every slot, taunt, die, then ds_next_class.
alias ds_class "wait 132; alias ds_k ds_class2; ds_move"
alias ds_class2 "alias ds_after_slots ds_class3; ds_slots"
alias ds_class3 "alias ds_k ds_next_class; ds_end"

// Run on a loaded map (`map cp_badlands` first): a `map` inside the cfg would run the rest during the load.
// The MOTD opens on join and sits over everything until dismissed; hidepanel closes it as Continue would.
alias ds_start "hidepanel info; mp_waitingforplayers_cancel 1; record tf2ds_specimen; wait 66; jointeam red; wait 66; tf_bot_add 1 soldier red; wait 132; ds_scout"

alias ds_scout "joinclass scout; alias ds_next_class ds_soldier; ds_class"
alias ds_soldier "joinclass soldier; alias ds_next_class ds_pyro; ds_class"
alias ds_pyro "joinclass pyro; alias ds_next_class ds_demoman; ds_class"
alias ds_demoman "joinclass demoman; alias ds_next_class ds_heavy; ds_class"
alias ds_heavy "joinclass heavyweapons; alias ds_next_class ds_engineer; ds_class"
alias ds_engineer "joinclass engineer; alias ds_next_class ds_engineer_build; ds_class"
alias ds_engineer_build "joinclass engineer; wait 132; build 2 0; wait 66; +attack; wait 10; -attack; wait 330; build 0 0; wait 66; +attack; wait 10; -attack; wait 198; kill; wait 99; ds_medic"
alias ds_medic "joinclass medic; alias ds_next_class ds_sniper; ds_class"
alias ds_sniper "joinclass sniper; wait 132; slot1; wait 40; +attack2; wait 99; +attack; wait 10; -attack; -attack2; wait 66; alias ds_next_class ds_spy; alias ds_k ds_class3; ds_move"
alias ds_spy "joinclass spy; alias ds_next_class ds_spy_disguise; ds_class"
alias ds_spy_disguise "joinclass spy; wait 132; disguise 5 -2; wait 132; +attack2; wait 66; -attack2; wait 132; +attack2; wait 10; -attack2; wait 66; kill; wait 99; ds_conds"

// Forced conditions as one class (soldier), each held for a second: uber 5, crits 11, stun 15, burning 22,
// jarate 24, bleed 25, mad milk 27, speed 32, giant 74, tiny 75, ghost 77, parachute 80, kart 82, swim curse 86.
// Enemy bots join only here, at the end: added at the start they had time to cap and end the round mid-run.
alias ds_conds "tf_bot_add 1 heavyweapons blue; tf_bot_add 1 medic blue; tf_bot_add 1 spy blue; joinclass soldier; wait 132; addcond 5; wait 66; removecond 5; addcond 11; alias ds_k ds_conds2; ds_fire"
alias ds_conds2 "removecond 11; addcond 15; alias ds_k ds_conds3; ds_move"
alias ds_conds3 "removecond 15; addcond 22; wait 66; removecond 22; addcond 24; wait 66; removecond 24; addcond 25; wait 66; removecond 25; addcond 27; wait 66; removecond 27; addcond 32; alias ds_k ds_conds4; ds_move"
alias ds_conds4 "removecond 32; addcond 75; wait 66; removecond 75; addcond 74; wait 66; removecond 74; addcond 77; alias ds_k ds_conds5; ds_move"
alias ds_conds5 "removecond 77; +jump; wait 15; -jump; addcond 80; wait 66; removecond 80; addcond 82; alias ds_k ds_conds6; ds_move"
alias ds_conds6 "removecond 82; addcond 86; alias ds_k ds_conds7; ds_move"
alias ds_conds7 "removecond 86; explode; wait 165; ds_finish"

// Not ds_stop: that name is an engine ConCommand, and the alias is refused.
alias ds_finish "stop; wait 66; disconnect; echo tf2ds_specimen done"

ds_start
