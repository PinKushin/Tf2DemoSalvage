// tf2ds_specimen.cfg - the shared steps of one deterministic era specimen: the same sequence on every TF2 build, so two
// eras' demos differ by the era and not by what happened that day (docs/measurements/2026-10-28-era-specimens-v2-plan.md).
//
// This file only DEFINES; it starts nothing. Run, on a loaded map (`tv_enable 1` BEFORE `map cp_granary`, or SourceTV
// never attaches):
//     exec tf2ds_specimen; exec tf2ds_era_<era>; ds_start
// tf2ds_era_<era>.cfg redefines the few steps whose MEANING differs in that era (e.g. `build` before 2011). A step an
// era does not have is not overridden: it prints `Unknown command`, the chain goes on, and the refusal is a finding for
// docs/RECORDING_CHECKLIST.md. For a timing run without recording, add `exec tf2ds_dryrun` before ds_start.
//
// It records POV `tf2ds_specimen.dem` and SourceTV `tf2ds_specimen_stv.dem`: chat, a name change,
// voice from voice_input.wav, every class through every weapon slot, taunts, buildings, a disguise, a capture of the
// middle point, forced conditions (TF_COND_* numbers from tf_shareddefs.h ETFCond, modern numbering), deaths, a pause,
// spectating, a round restart, and deliberate unknown commands. Timing is in `wait`s, and a wait is NOT one frame:
// on 2013 at fps_max 66, 462 waits spanned 244 ticks (about 1.9 per tick). The ORDER is deterministic and the seconds
// are not, so a run's wall time is measured from the `tf2ds_mark` echoes in console.log, never assumed.
//
// SEQUENCING: a `wait` delays only the rest of the text it appears in (CCommandBuffer::AddText, tier1/
// commandbuffer.cpp; identical in hl2sdk orangebox). An alias's waits do NOT delay its caller, so `a; b` with waits
// inside `a` runs `b` at once (measured: `t_in; wait; echo C` printed C before t_in's second line). So every reusable
// step ends by running `ds_k`, and its caller sets `ds_k` to what comes next. Never list two waiting aliases in a row.
// Aliases cannot hold quotes, so no value below may need them.

sv_cheats 1
sv_allow_wait_command 1
sv_pausable 1
cl_disablehtmlmotd 1
// fps_max is `notconnected`: on a loaded map this line prints "Can't set fps_max when connected" and does nothing
// (measured, build 5252, 2013). Set `fps_max 66` BEFORE `map cp_granary`; an unlimited fps_max (0) ran the whole
// chain in 32.7 s instead of minutes, since every wait is frames.
fps_max 66
mp_respawnwavetime 0
mp_disable_respawn_times 1
mp_waitingforplayers_cancel 1
tf_bot_quota 0

// Recording; tf2ds_dryrun.cfg replaces these with echoes. SourceTV runs tv_delay behind the game, and build 3258 clamps
// tv_delay to at least 10 s (measured: `"tv_delay" = "10.000000" ... min. 10.000000`), so the SourceTV recording is
// stopped 11 s (726 frames) after the POV one, or the last 10 s of the session would be missing from it.
alias ds_rec "record tf2ds_specimen; tv_record tf2ds_specimen_stv"
alias ds_pov_stop "stop"
alias ds_stv_stop "tv_stoprecord"

// Reusable steps; each ends with ds_k.
alias ds_move "+forward; wait 99; -forward; +moveleft; wait 66; -moveleft; +back; wait 33; -back; +moveright; wait 66; -moveright; +jump; wait 15; -jump; wait 66; +duck; wait 66; -duck; wait 10; ds_k"
alias ds_fire "+attack; wait 99; -attack; +attack2; wait 33; -attack2; +reload; wait 66; -reload; wait 10; ds_k"
alias ds_end "taunt; wait 330; kill; wait 99; ds_k"

// Every slot fired, then ds_after_slots.
alias ds_slots "slot1; wait 40; alias ds_k ds_slots2; ds_fire"
alias ds_slots2 "slot2; wait 40; alias ds_k ds_slots3; ds_fire"
alias ds_slots3 "slot3; wait 40; alias ds_k ds_after_slots; ds_fire"

// One class: spawn, move, every slot, taunt, die, then ds_next_class.
alias ds_class "wait 132; alias ds_k ds_class2; ds_move"
alias ds_class2 "alias ds_after_slots ds_class3; ds_slots"
alias ds_class3 "alias ds_k ds_next_class; ds_end"

// Run on a loaded map: a `map` inside the cfg would run the rest during the load.
// The MOTD opens on join and sits over everything until dismissed; hidepanel closes it as Continue would.
alias ds_start "echo tf2ds_mark start; hidepanel info; mp_waitingforplayers_cancel 1; ds_rec; wait 66; jointeam red; wait 66; tf_bot_add 1 soldier red; wait 132; ds_extras"

// Chat (SayText2), a name change through userinfo, voice (svc_VoiceData from voice_input.wav, which the session places
// in the game folder), and two commands no build has, whose refusals date the build's command set.
alias ds_extras "echo tf2ds_mark extras; say hello from tf2ds_specimen; wait 33; say_team team line; wait 33; name PinKushin; wait 66; say hi; wait 33; tf2ds_unknown_one; tf2ds_unknown_two 1; wait 33; voice_loopback 1; voice_inputfromfile 1; +voicerecord; wait 330; -voicerecord; voice_inputfromfile 0; voice_loopback 0; wait 33; ds_scout"

alias ds_scout "echo tf2ds_mark scout; joinclass scout; alias ds_next_class ds_soldier; ds_class"
alias ds_soldier "echo tf2ds_mark soldier; joinclass soldier; alias ds_next_class ds_pyro; ds_class"
alias ds_pyro "echo tf2ds_mark pyro; joinclass pyro; alias ds_next_class ds_demoman; ds_class"
alias ds_demoman "echo tf2ds_mark demoman; joinclass demoman; alias ds_next_class ds_heavy; ds_class"
alias ds_heavy "echo tf2ds_mark heavy; joinclass heavyweapons; alias ds_next_class ds_engineer; ds_class"
alias ds_engineer "echo tf2ds_mark engineer; joinclass engineer; alias ds_next_class ds_engineer_build; ds_class"
// Modern `build <building> <mode>`: 2 sentry, 0 dispenser. tf2ds_era_pre2011.cfg (2007..2009) redefines only these two
// for the one-argument form; the rest of the step is shared.
alias ds_build_sentry "build 2 0"
alias ds_build_dispenser "build 0 0"
// Built in the open beside the middle point: placed in the spawn room, the sentry stayed `m_bPlacing 1` and never
// built (measured, 2013); at (-1536 300) a dispenser went to `m_bBuilding 1`. The sentry's 130 metal leaves 70 of 200,
// short of the dispenser's 100, so `impulse 101` refills metal between the two (measured: no dispenser without it).
// A dead player re-joining the SAME class waits out the full respawn (428 ticks, measured on 2013) while a different
// class respawns in 50, so the setpos and builds ran while dead. Join scout first, then the real class from spawn.
//
// The kill waits for BOTH buildings to FINISH, read from the demo, not counted. A fixed `wait 198` killed them early in
// every era after 3862 (D240; plan record, differences table): construction runs in wall time (sentry ~10.5 s,
// dispenser ~21 s, the same rate in every era measured) while a `wait`'s length varies per client, so the slower 2010
// clients killed only the dispenser and the faster 2013 / live clients killed both. So the step ends on
// `tf2ds_mark engineer_wait`, the session's driver reads the POV demo as it is recorded and sends `ds_engineer_go`
// once both read finished, and ds_engineer_go disarms the fallback so the rest runs once. The kill comes at whichever
// fires first. The fallback, 7920 waits, measured 55-64 s of wall time where it fired first (live, 4269: the demo
// flushes in ~196 KB chunks, so a slow poll can lag a minute), against the dispenser's 21 s. So acceptance is read
// from the DEMO (both buildings' last state pct 1), not from the order of the console marks.
alias ds_engineer_noop "echo tf2ds_mark engineer_fallback_disarmed"
alias ds_engineer_go "alias ds_engineer_cont ds_engineer_noop; echo tf2ds_mark engineer_go; kill; wait 99; ds_medic"
alias ds_engineer_cont "echo tf2ds_mark engineer_fallback; ds_engineer_go"
alias ds_engineer_build "echo tf2ds_mark engineer_build; joinclass scout; wait 132; joinclass engineer; wait 132; sv_cheats 1; setpos -1536 300 -340; wait 33; ds_build_sentry; wait 66; +attack; wait 33; -attack; wait 330; sv_cheats 1; impulse 101; setpos -1536 -300 -340; wait 33; ds_build_dispenser; wait 66; +attack; wait 33; -attack; echo tf2ds_mark engineer_wait; wait 7920; ds_engineer_cont"
alias ds_medic "echo tf2ds_mark medic; joinclass medic; alias ds_next_class ds_sniper; ds_class"
alias ds_sniper "echo tf2ds_mark sniper; joinclass sniper; wait 132; slot1; wait 40; +attack2; wait 99; +attack; wait 10; -attack; -attack2; wait 66; alias ds_next_class ds_spy; alias ds_k ds_class3; ds_move"
alias ds_spy "echo tf2ds_mark spy; joinclass spy; alias ds_next_class ds_spy_disguise; ds_class"
alias ds_spy_disguise "echo tf2ds_mark spy_disguise; joinclass scout; wait 132; joinclass spy; wait 132; disguise 5 -2; wait 132; +attack2; wait 66; -attack2; wait 132; +attack2; wait 10; -attack2; wait 66; kill; wait 99; ds_capture"

// Capture the middle point, cp_granary's index 3 at (-1536 0 -377), neutral at start, the same origin in the 2007, 2008,
// 2009, 2013 and live BSPs. A solo capture took 1608 ticks (24 s, measured on 2013), so the original 1320-frame hold
// never captured in any era; 3960 frames is 60 s at fps_max 66 and still over 26 s if a client runs at 150 fps.
// Whether the capture landed is read from the demo (teamplay_point_captured), not assumed. Then the name change (svc_UpdateStringTable on userinfo).
// sv_cheats 1 is re-set right before each cheat command: the owner's class cfgs (scout.cfg ... soldier.cfg) exec his
// pinconfig.cfg, which ends `wait 60; sv_cheats 0`, so every joinclass turns cheats off 60 frames later (measured, 2013:
// "Can't use cheat command setpos"). The same pinconfig ships in the 2007, 2008, 2011 and 2013 folders.
alias ds_capture "echo tf2ds_mark capture; joinclass soldier; wait 132; sv_cheats 1; setpos -1536 0 -340; wait 3960; name tf2ds_renamed; wait 66; kill; wait 99; ds_conds"

// Forced conditions as one class (soldier), each held for a second: uber 5, crits 11, stun 15, burning 22,
// jarate 24, bleed 25, mad milk 27, speed 32, giant 74, tiny 75, ghost 77, parachute 80, kart 82, swim curse 86.
// Enemy bots join only here, at the end: added at the start they had time to cap and end the round mid-run.
alias ds_conds "echo tf2ds_mark conds; tf_bot_add 1 heavyweapons blue; tf_bot_add 1 medic blue; tf_bot_add 1 spy blue; joinclass soldier; wait 132; sv_cheats 1; addcond 5; wait 66; removecond 5; addcond 11; alias ds_k ds_conds2; ds_fire"
alias ds_conds2 "removecond 11; addcond 15; alias ds_k ds_conds3; ds_move"
alias ds_conds3 "removecond 15; addcond 22; wait 66; removecond 22; addcond 24; wait 66; removecond 24; addcond 25; wait 66; removecond 25; addcond 27; wait 66; removecond 27; addcond 32; alias ds_k ds_conds4; ds_move"
alias ds_conds4 "removecond 32; addcond 75; wait 66; removecond 75; addcond 74; wait 66; removecond 74; addcond 77; alias ds_k ds_conds5; ds_move"
alias ds_conds5 "removecond 77; +jump; wait 15; -jump; addcond 80; wait 66; removecond 80; addcond 82; alias ds_k ds_conds6; ds_move"
alias ds_conds6 "removecond 82; addcond 86; alias ds_k ds_conds7; ds_move"
alias ds_conds7 "removecond 86; explode; wait 165; ds_tail"

// A pause (svc_SetPause), spectating with spec_next (svc_SetView, observer state), then a round restart (round events,
// a second full snapshot).
alias ds_tail "echo tf2ds_mark tail; pause; wait 66; unpause; wait 66; jointeam spectator; wait 66; spec_next; wait 66; spec_next; wait 66; mp_restartgame 1; wait 330; ds_finish"

// Not ds_stop: that name is an engine ConCommand, and the alias is refused.
alias ds_finish "echo tf2ds_mark finish; ds_pov_stop; wait 726; ds_stv_stop; wait 66; disconnect; echo tf2ds_specimen done"
